<!doctype html>
<!--
  Source for the Open Graph share card. Rendered once to
  public/share-card.png at 1200x630 — the size messaging apps and social
  previews expect.

  Regenerate:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --window-size=1200,630 --default-background-color=0 \
      --screenshot=public/share-card.png scripts/share-card.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Outfit';
        src: url('../node_modules/@fontsource/outfit/files/outfit-latin-700-normal.woff2')
          format('woff2');
        font-weight: 700;
      }
      @font-face {
        font-family: 'Inter';
        src: url('../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2')
          format('woff2');
        font-weight: 400;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        background: #faf8f5;
        font-family: 'Inter', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 88px;
        position: relative;
      }
      .rule { position: absolute; top: 0; left: 0; right: 0; height: 10px; background: #9a6d3a; }
      .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 44px; }
      .brand span {
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        font-size: 34px;
        letter-spacing: -0.02em;
        color: #231e17;
      }
      h1 {
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        font-size: 74px;
        line-height: 1.08;
        letter-spacing: -0.03em;
        color: #231e17;
        margin-bottom: 30px;
      }
      p { font-size: 29px; line-height: 1.45; color: #5e5140; max-width: 880px; }
      .foot {
        position: absolute;
        bottom: 54px;
        left: 88px;
        right: 88px;
        display: flex;
        gap: 30px;
        font-size: 21px;
        color: #9c8a70;
      }
      .foot b { color: #7d6d56; font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="rule"></div>

    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 32 32">
        <defs>
          <linearGradient id="g" x1="50%" y1="100%" x2="50%" y2="0%">
            <stop offset="0%" style="stop-color:#9a6d3a" />
            <stop offset="40%" style="stop-color:#b8864e" />
            <stop offset="100%" style="stop-color:#cda577" />
          </linearGradient>
        </defs>
        <circle cx="16" cy="16" r="14" fill="url(#g)" />
        <path
          d="M16 6c-1.5 4-5 7-5 12a5 5 0 0010 0c0-5-3.5-8-5-12z"
          fill="none"
          stroke="#faf8f5"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
        <path
          d="M16 12c-0.8 2-2.5 3.5-2.5 6a2.5 2.5 0 005 0c0-2.5-1.7-4-2.5-6z"
          fill="#faf8f5"
          opacity="0.4"
        />
      </svg>
      <span>Strong Fire</span>
    </div>

    <h1>Your money.<br />Your rights.<br />Your path.</h1>
    <p>Straight answers about money, benefits and your rights — free, private, and yours to keep.</p>

    <div class="foot">
      <span><b>Free</b> · no sign-up</span>
      <span><b>Private</b> · nothing leaves your phone</span>
      <span><b>Works offline</b></span>
    </div>
  </body>
</html>
